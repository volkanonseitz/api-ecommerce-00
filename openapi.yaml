        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      operationId: indexOrderQuery
    post:
      summary: Store (OrderTransaction) - /orders
      tags:
      - Orders
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      operationId: storeOrderTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                delivery_time:
                  type: string
                customer_contact:
                  type: string
                customer_name:
                  type: string
                altered_payment_gateway:
                  type: string
                products:
                  type: array
                  items:
                    type: string
                card:
                  type: array
                  items:
                    type: string
                token:
                  type: string
                use_wallet_points:
                  type: boolean
                shipping_address:
                  type: array
                  items:
                    type: string
                billing_address:
                  type: array
                  items:
                    type: string
                note:
                  type: string
              required:
              - customer_contact
              - payment_gateway
              - products
  /my-orders:
    get:
      summary: Myorders (OrderQuery) - /my-orders
      tags:
      - Orders
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
