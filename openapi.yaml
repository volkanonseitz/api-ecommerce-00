components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
            permissions:
              type: array
              items:
                type: string
              example:
              - customer
            email_verified:
              type: boolean
              example: true
            role:
              type: string
              example: customer
            session_id:
              type: string
              example: some-uuid-session-id
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Email atau password tidak valid.
        errors:
          type: object
          additionalProperties: {}
    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
            - The email field is required.
            password:
            - The password field is required.
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com
        contact:
          type: string
          nullable: true
          example: 08123456789
        avatar:
          type: string
          format: url
          nullable: true
          example: http://localhost:8000/storage/avatars/avatar.jpg
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SingleUserResponse:
      type: object
      properties:
        message:
          type: string
          example: Profile retrieved successfully
        data:
          $ref: '#/components/schemas/User'
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Wireless Bluetooth Earbuds
        slug:
          type: string
          example: wireless-bluetooth-earbuds
        description:
          type: string
          example: High-quality sound with long battery life.
        price:
          type: number
          format: float
          example: 29.99
        sale_price:
          type: number
          format: float
          nullable: true
          example: 24.99
        sku:
          type: string
          nullable: true
          example: WBE001
        quantity:
          type: integer
          example: 100
        unit:
          type: string
          example: piece
        width:
          type: string
          nullable: true
          example: 5cm
        height:
          type: string
          nullable: true
          example: 10cm
        length:
          type: string
          nullable: true
          example: 3cm
        image:
          type: string
          format: url
          nullable: true
          example: http://localhost:8000/storage/products/earbuds.jpg
        gallery:
          type: array
          items:
            type: string
            format: url
          example:
          - http://localhost:8000/storage/products/earbuds-1.jpg
          - http://localhost:8000/storage/products/earbuds-2.jpg
        category_id:
          type: integer
          example: 1
        shop_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductPaginatedResponse:
      type: object
      properties:
        message:
          type: string
          example: Products retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
        meta:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: integer
            last_page:
              type: integer
            path:
              type: string
            per_page:
              type: integer
            to:
              type: integer
            total:
              type: integer
    SingleProductResponse:
      type: object
      properties:
        message:
          type: string
          example: Product retrieved successfully
        data:
          $ref: '#/components/schemas/Product'
    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        amount:
          type: number
          format: float
          example: 150.0
        order_status:
          type: string
          enum:
          - pending
          - processing
