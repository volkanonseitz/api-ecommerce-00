openapi: 3.0.0
info:
  title: API E-commerce
  version: 1.0.0
  description: Dokumentasi API untuk aplikasi e-commerce.
servers:
- url: http://localhost:8000/api
  description: Development server
security:
- BearerAuth: []
tags:
- name: Authentication
  description: User authentication and registration
- name: Products
  description: Product catalog and search
- name: Orders
  description: User and admin order management
- name: Categories
  description: Product categories management
- name: Shops
  description: Shop management
- name: Profile
  description: User profile management
- name: Security
  description: User security features
paths:
  /register:
    post:
      summary: Register (Auth) - /register
      tags:
      - Authentication
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      operationId: registerAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                profile:
                  type: array
                  items:
                    type: string
                profile.avatar:
                  type: string
                  maxLength: 2048
                profile.bio:
                  type: string
                  maxLength: 1000
                profile.socials:
                  type: array
                  items:
                    type: string
                address:
                  type: array
                  items:
                    type: string
                address.street_address:
                  type: string
                  maxLength: 255
                address.city:
                  type: string
                  maxLength: 255
                address.state:
                  type: string
                  maxLength: 255
                address.zip:
                  type: string
                  maxLength: 20
                address.country:
                  type: string
                  maxLength: 255
                permission:
                  type: string
              required:
              - email
              - name
              - password
  /login:
    post:
      summary: Login (Auth) - /login
      tags:
      - Authentication
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      operationId: loginAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
              - email
              - password
  /social-login:
    post:
      summary: Sociallogin (Auth) - /social-login
      tags:
      - Authentication
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      operationId: socialLoginAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                access_token:
                  type: string
              required:
              - access_token
              - provider
  /logout:
    post:
      summary: Logout (Auth) - /logout
      tags:
      - Authentication
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
      operationId: logoutAuth
  /password/forgot:
    post:
      summary: Forgotpassword (Auth) - /password/forgot
      tags:
      - Authentication
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: forgotPasswordAuth
  /password/reset:
    post:
      summary: Resetpassword (Auth) - /password/reset
      tags:
      - Authentication
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: resetPasswordAuth
  /vendors:
    get:
      summary: Get a list of vendors (placeholder)
      tags:
      - Authentication
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Placeholder response for vendors list
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Vendors list (placeholder)
                  data:
                    type: array
                    items: {}
  /products:
    get:
      summary: Index (ProductQuery) - /products
      tags:
      - Products
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: indexProductQuery
    post:
      summary: Store (ProductCrud) - /products
      tags:
      - Products
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      operationId: storeProductCrud
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                slug:
                  type: string
                price:
                  type: number
                  format: float
                categories:
                  type: array
                  items:
                    type: string
                tags:
                  type: array
                  items:
                    type: string
                language:
                  type: string
                dropoff_locations:
                  type: array
                  items:
                    type: string
                pickup_locations:
                  type: array
                  items:
                    type: string
                digital_file:
                  type: array
                  items:
                    type: string
                variations:
                  type: array
                  items:
                    type: string
                variation_options:
                  type: array
                  items:
                    type: string
                quantity:
                  type: integer
                unit:
                  type: string
                description:
                  type: string
                  maxLength: 10000
                sku:
                  type: string
                image:
                  type: array
                  items:
                    type: string
                gallery:
                  type: array
                  items:
                    type: string
                video:
                  type: array
                  items:
                    type: string
                metas:
                  type: array
                  items:
                    type: string
                metas.*.key:
                  type: string
                  enum:
                  - meta_title
                  - meta_description
                  - meta_keywords
                  - custom_label
                  - custom_value
                metas.*.value:
                  type: string
                status:
                  type: string
                height:
                  type: string
                length:
                  type: string
                width:
                  type: string
                external_product_url:
                  type: string
                external_product_button_text:
                  type: string
                in_stock:
                  type: boolean
                is_taxable:
                  type: boolean
                is_digital:
                  type: boolean
                is_external:
                  type: boolean
                is_rental:
                  type: boolean
                variation_options.upsert.*.sku:
                  type: string
              required:
              - metas.*.key
              - name
              - product_type
              - shop_id
              - type_id
              - unit
  /products/{id}:
    get:
      summary: Show (ProductQuery) - /products/{id}
      tags:
      - Products
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Identifier for id
      operationId: showProductQuery
    put:
      summary: Update an existing product (Staff/Store Owner)
      tags:
      - Products
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          example: 1
        description: ID of the product to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Updated Wireless Earbuds
                price:
                  type: number
                  format: float
                  example: 34.99
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleProductResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (insufficient permissions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
    delete:
      summary: Destroy (ProductCrud) - /products/{id}
      tags:
      - Products
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Identifier for id
      operationId: destroyProductCrud
      security:
      - BearerAuth: []
    patch:
      summary: Update (ProductCrud) - /products/{id}
      tags:
      - Products
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Identifier for id
      operationId: updateProductCrud
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                slug:
                  type: string
                price:
                  type: number
                  format: float
                categories:
                  type: array
                  items:
                    type: string
                tags:
                  type: array
                  items:
                    type: string
                language:
                  type: string
                dropoff_locations:
                  type: array
                  items:
                    type: string
                pickup_locations:
                  type: array
                  items:
                    type: string
                digital_file:
                  type: array
                  items:
                    type: string
                variations:
                  type: array
                  items:
                    type: string
                variation_options:
                  type: array
                  items:
                    type: string
                quantity:
                  type: integer
                unit:
                  type: string
                description:
                  type: string
                  maxLength: 10000
                sku:
                  type: string
                image:
                  type: array
                  items:
                    type: string
                gallery:
                  type: array
                  items:
                    type: string
                video:
                  type: array
                  items:
                    type: string
                metas:
                  type: array
                  items:
                    type: string
                metas.*.key:
                  type: string
                  enum:
                  - meta_title
                  - meta_description
                  - meta_keywords
                  - custom_label
                  - custom_value
                metas.*.value:
                  type: string
                status:
                  type: string
                height:
                  type: string
                length:
                  type: string
                width:
                  type: string
                external_product_url:
                  type: string
                external_product_button_text:
                  type: string
                in_stock:
                  type: boolean
                is_taxable:
                  type: boolean
                is_digital:
                  type: boolean
                is_external:
                  type: boolean
                is_rental:
                  type: boolean
                variation_options.upsert.*.sku:
                  type: string
              required:
              - metas.*.key
              - name
              - product_type
              - shop_id
              - type_id
              - unit
